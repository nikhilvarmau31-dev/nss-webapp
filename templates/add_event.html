{% extends "base.html" %}
{% block title %}Add Event{% endblock %}
{% block content %}
<section class="page-header">
    <div class="container"><h1>Add New Event</h1>
    <nav class="breadcrumb"><a href="/">Home</a> <i class="fas fa-chevron-right"></i> <a href="{{ url_for('event_list') }}">Events</a> <i class="fas fa-chevron-right"></i> Add Event</nav></div>
</section>
<section class="section">
    <div class="container">
        <div class="form-wrapper">
            <form method="POST" action="{{ url_for('add_event') }}">
                <div class="form-row">
                    <div class="form-group"><label>Event Title *</label><input type="text" name="title" required placeholder="e.g. Blood Donation Camp"></div>
                    <div class="form-group"><label>Category *</label>
                        <select name="category" required>
                            <option>Health</option><option>Environment</option><option>Education</option>
                            <option>Community</option><option>Disaster Relief</option><option>Social Awareness</option><option>Camp</option><option>Other</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Date *</label><input type="date" name="date" required></div>
                    <div class="form-group"><label>Time *</label><input type="time" name="time" required></div>
                </div>
                <div class="form-group full-width"><label>Venue *</label><input type="text" name="venue" required placeholder="e.g. College Auditorium / Village Panchayat Hall"></div>
                <div class="form-group full-width"><label>Description *</label><textarea name="description" rows="4" required placeholder="Describe the event..."></textarea></div>
                <div class="form-row">
                    <div class="form-group"><label>Organizer Name *</label><input type="text" name="organizer" required placeholder="Dr. / Prof. Name"></div>
                    <div class="form-group"><label>Service Hours</label><input type="number" name="hours" min="1" max="24" placeholder="e.g. 4"></div>
                </div>
                <div class="form-group"><label>Max Volunteers</label><input type="number" name="max_volunteers" value="50" min="1"></div>
                <button type="submit" class="btn btn-primary btn-block"><i class="fas fa-plus"></i> Add Event</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
